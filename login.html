<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Trusted DC Seller</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">

</head>

<body>

<div class="login-bg"></div>

<header>

<nav class="navbar">

<a href="index.html" class="logo">

<i class="fa-brands fa-discord"></i>

<span>Trusted DC Seller</span>

</a>

<a href="index.html" class="discord-btn">

Back to Home

</a>

</nav>

</header>

<section class="login-page">

<div class="login-card">

<div class="login-top">

<i class="fa-solid fa-user-shield"></i>

<h2>Welcome Back</h2>

<p>

Login to your Trusted DC Seller account

</p>

</div>

<form id="loginForm">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

</div>

<div class="remember">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button
type="submit"
class="login-btn">

Login

</button>
<!-- Divider -->

<div class="login-divider">

<span>OR</span>

</div>

<!-- Discord Login Button -->

<a href="https://discord.gg/3xh2aJM4d"

target="_blank"

class="discord-login">

<i class="fa-brands fa-discord"></i>

Continue with Discord

</a>

<!-- Register -->

<div class="register-link">

<p>

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>

</div>

<!-- Security Notice -->

<div class="login-info">

<i class="fa-solid fa-shield-halved"></i>

<span>

Your account is protected with secure authentication.

</span>

</div>

</form>

</div>

</section>

<footer class="login-footer">

<p>

© 2026 Trusted DC Seller

</p>

<p>

Designed & Developed by Prince

</p>

</footer>

<script src="script.js"></script>

</body>
</html>
